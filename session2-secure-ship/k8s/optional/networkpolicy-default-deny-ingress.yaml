# OPTIONAL next step: default-deny INGRESS for the namespace, then allow only what you need.
# Enforced by the Cilium data plane from Session 1.
#
# Egress is left open on purpose: restricting it also means allowing DNS and Key Vault, and
# the DNS setup differs between AKS Automatic and Standard. Do that as a separate exercise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: secure-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: secure-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
