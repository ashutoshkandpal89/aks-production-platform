# OPTIONAL. A tolerant, interruptible workload that runs on the Spot pool above.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spot-worker
  namespace: ops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spot-worker
  template:
    metadata:
      labels:
        app: spot-worker
    spec:
      nodeSelector:
        workload-class: spot
      tolerations:
        - key: workload-class
          operator: Equal
          value: spot
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: mcr.microsoft.com/azurelinux/base/core:3.0
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
