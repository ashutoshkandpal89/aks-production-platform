# OPTIONAL: the Secrets Store CSI driver way to use Key Vault.
# Instead of calling Key Vault from code, the driver mounts secrets as files in the pod.
# It uses the SAME workload identity (same ServiceAccount, same federated credential).
#
# Needs the add-on:   az aks enable-addons -g <rg> -n <cluster> --addons azure-keyvault-secrets-provider
# Check that your cluster type supports it before relying on it (for example on AKS Automatic).
#
# Then mount it in a pod:
#   volumes:
#     - name: secrets
#       csi:
#         driver: secrets-store.csi.k8s.io
#         readOnly: true
#         volumeAttributes:
#           secretProviderClass: kv-demo
#   (and a volumeMount at /mnt/secrets in the container)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-demo
  namespace: secure-demo
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "__WI_CLIENT_ID__"
    keyvaultName: "__KEYVAULT_NAME__"
    tenantId: "__TENANT_ID__"
    objects: |
      array:
        - |
          objectName: demo-secret
          objectType: secret
