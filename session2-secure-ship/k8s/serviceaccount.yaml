# The ServiceAccount the pod runs as. The annotation names the managed identity it may become.
# The federated credential (created by infra/) only trusts THIS namespace + name.
# __WI_CLIENT_ID__ is filled in by scripts/02-deploy-secret-reader.sh or the pipeline.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-reader-sa
  namespace: secure-demo
  annotations:
    azure.workload.identity/client-id: "__WI_CLIENT_ID__"
